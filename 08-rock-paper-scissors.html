<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css/global.css" />
  </head>

  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('rock')">Rock</button>

    <button onclick="playGame('paper')">Paper</button>

    <button onclick="playGame('scissors')">Scissors</button>

    <button id="reset-btn">Reset Score</button>

    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };

      function playGame(playerMove) {
        let computerMove = pickComputerMove();
        let result = compareMove(playerMove, computerMove);

        if (result === "You win.") {
          score.wins++;
        } else if (result === "You lose.") {
          score.losses++;
        } else if (result === "Tie.") {
          score.ties++;
        }
        localStorage.setItem("score", JSON.stringify(score));
        showResult(playerMove, computerMove, result);
      }

      function pickComputerMove() {
        let randomNumber = Math.random();
        let computerMove;

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = "paper";
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = "scissors";
        }
        return computerMove;
      }

      function compareMove(playerMove, computerMove) {
        let result;
        if (playerMove === computerMove) {
          result = "Tie.";
        } else if (
          (playerMove === "rock" && computerMove === "scissors") ||
          (playerMove === "paper" && computerMove === "rock") ||
          (playerMove === "scissors" && computerMove === "paper")
        ) {
          result = "You win.";
        } else {
          result = "You lose.";
        }
        return result;
      }

      function showResult(playerMove, computerMove, result) {
        alert(
          `You picked ${playerMove}. Computer picked ${computerMove}. ${result}\nWins: ${score.wins}, Losses: ${score.losses}, Tie: ${score.ties}`
        );
      }

      const resetBtn = document.querySelector("#reset-btn");
      resetBtn.addEventListener("click", function () {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.setItem("score", JSON.stringify(score));
        console.log("Score Reset.");
      });
    </script>
  </body>
</html>
