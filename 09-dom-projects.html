<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Projects</title>
    <link rel="stylesheet" href="./css/global.css" />
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button class="js-subscribe-btn" onclick="subscribe()">Subscribe</button>
    <br /><br />

    <p>Rock Paper Scissors</p>
    <a href="./09-rock-paper-scissors.html">Click here</a>
    <br /><br />

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input type="text" placeholder="Type your budget" />
    <button>Calculate</button>
    <br /><br /><br />

    <a href="#">CSS version of these projects</a>

    <script>
      function subscribe() {
        const subscribeBtn = document.querySelector(".js-subscribe-btn");

        subscribeBtn.innerText === "Subscribe"
          ? (subscribeBtn.innerText = "Subscribed")
          : (subscribeBtn.innerText = "Subscribe");
      }
    </script>
  </body>
</html>
