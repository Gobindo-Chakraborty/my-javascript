      const arr = [1, 1, -3, 2, 5];
      console.log(`normal arr first : ${arr}`);

      console.log(
        "%cFor Loop",
        "font-weight: bold; font-size: 24px; color: green;"
      );

      for (let i = 0; i < arr.length; i++) {
        console.log("Loop For _ " + " Value : " + arr[i] + " Index " + i);
        console.log(arr[i] * 2);
      }

      console.log(
        "%cWhile Loop",
        "font-weight: bold; font-size: 24px; color: green;"
      );

      let i = 0;
      while (i < arr.length) {
        console.log("While Loop _ " + " Value : " + arr[i] + " Index " + i);
        console.log(arr[i] * 2);
        i++;
      }

      console.log(
        "%cDo While Loop",
        "font-weight: bold; font-size: 24px; color: green;"
      );

      i = 0;
      do {
        console.log("Do While _ " + " Value : " + arr[i] + " Index " + i);
        console.log(arr[i] * 2);
        i++;
      } while (i < arr.length);

      console.log(
        "%cForEach function",
        "font-weight: bold; font-size: 24px; color: green;"
      );

      arr.forEach((value, index) => {
        console.log("ForEach _ " + " Value : " + value + " Index " + index);
        console.log(value * 2);
      });

      console.log(
        "%cFilter function",
        "font-weight: bold; font-size: 24px; color: green;"
      );

      arr.filter((value, index) => {
        console.log("Filter _ " + " Value : " + value + " Index " + index);
        console.log(value * 2);
      });

      console.log(
        "%cMap function",
        "font-weight: bold; font-size: 24px; color: green;"
      );

      arr.map((value, index) => {
        console.log("Map _ " + " Value : " + value + " Index " + index);
        console.log(value * 2);
      });
