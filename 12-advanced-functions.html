      ["make dinenr", "wash dishes", "watch youtube"].forEach(
        (value, index) => {
          if (value === "wash dishes") {
            return;
          }
          console.log(value, index);
        }
      ); // forEach is a function but if is  Conditional statement or keyword so if could use return if it is inside of forEach function. because function could use return;
      // forEach -> if -> return

      console.log("=============");

      const taskArray = ["make dinenr", "wash dishes", "watch youtube"];
      for (let i = 0; i < taskArray.length; i++) {
        if (taskArray[i] === "wash dishes") {
          continue;
        }
        console.log(taskArray[i], i);
      } // for is a loop but if is conditional statement or keyword so if could use return if it is inside of for loop. because loop can use continue
